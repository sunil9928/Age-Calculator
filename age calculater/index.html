<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Date of Birth Calculator</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

        <link rel="stylesheet" href="assets/css/style.css" />
    </head>

    <body>
        <section class="age-compare">
            <div class="container">
                <h1 class="text-center">Age Comparison</h1>

                <div class="comparison-stage">
                    <!-- CHARACTER 1 -->
                    <div class="person-card person-1">
                        <img src="assets/images/character 1.png" alt="Person 1" class="person-image" />

                        <div class="person-form">
                            <h2>Person 1</h2>

                            <input type="text" id="name1" placeholder="Enter Name" />

                            <input type="date" id="dob1" />
                        </div>
                    </div>

                    <!-- CHARACTER 2 -->
                    <div class="person-card person-2">
                        <img src="assets/images/character 2.png" alt="Person 2" class="person-image" />

                        <div class="person-form">
                            <h2>Person 2</h2>

                            <input type="text" id="name2" placeholder="Enter Name" />

                            <input type="date" id="dob2" />
                        </div>
                    </div>

                    <!-- RESULT -->
                    <div class="result-area">
                        <button type="button" class="compare-btn" onclick="compareAges()">Compare Ages</button>

                        <div id="result" class="result-box" aria-live="polite">Select both birth dates to compare.</div>
                    </div>
                </div>
            </div>
        </section>

        <script src="script.js"></script>
    </body>
</html>
